
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NO SQL BYPASS | Chapéu de Palha</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d16;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 90%;
            max-width: 390px;
            padding: 35px;
            background: #111827;
            border: 1px solid #263449;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 24px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 14px;
            border-radius: 6px;
            font-size: 14px;
        }

        input {
            color: white;
            background: #0b1220;
            border: 1px solid #334155;
        }

        button {
            border: 0;
            background: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            background: #0b1220;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            display: none;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <main class="login">
        <h1>NO SQL BYPASS</h1>
        <p>Portal de autenticação corporativo.</p>
        <p>Identifique-se para acessar o sistema.</p>

        <form id="loginForm">
            <input
                type="text"
                id="username"
                placeholder="Usuário"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Senha"
                required
            >

            <button type="submit">AUTENTICAR</button>
        </form>

        <div id="result"></div>

        <div class="footer">
            CHAPÉU DE PALHA HACKERS CLUB
        </div>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            result.style.display = 'block';
            result.textContent = 'Autenticando...';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const message = await response.text();
                result.textContent = message;
            } catch (error) {
                result.textContent = 'Falha na comunicação com o servidor.';
            }
        });
    </script>
</body>
</html>
